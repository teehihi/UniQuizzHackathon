  <path fill="#FFFFFF" opacity="0.6" d="M122 36 C138 25 152 18 165 20 C154 30 142 36 130 42 Z" />
  <path fill="#FFFFFF" opacity="0.6" d="M55 42 C40 36 28 32 15 36 C25 44 38 48 50 50 Z" />

