<svg xmlns="http://www.w3.org/2000/svg" width="180" height="135" fill="none" viewBox="0 0 180 135">
  <!-- Aura Glow Filter / Effect -->
  <defs>
    <filter id="ssj-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Golden Spikes Background -->
  <path fill="#E5A100" stroke="#B27B00" stroke-width="2" d="M50 45 C30 35 10 25 0 35 C15 48 30 55 44 58 C25 64 6 75 0 88 C16 92 35 88 50 82 C38 94 25 106 20 115 C38 112 55 98 66 85 Z" />
